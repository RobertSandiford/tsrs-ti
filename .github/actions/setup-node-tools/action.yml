name: Set up Vite+ and Node
description: Install the pinned tools without installing workspace dependencies

inputs:
  package-json-file:
    description: Manifest containing the pnpm packageManager pin
    default: package.json

runs:
  using: composite
  steps:
    - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
      with:
        version-file: package.json
        node-version-file: .node-version
        run-install: false

    - name: Verify tools
      shell: bash
      env:
        PACKAGE_JSON_FILE: ${{ inputs.package-json-file }}
      run: |
        cd "$(dirname "$PACKAGE_JSON_FILE")"
        node --version
        vp --version
        pnpm --version
